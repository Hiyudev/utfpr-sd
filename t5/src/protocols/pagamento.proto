syntax = "proto3";

//
// Servico responsavel pelo gerenciamento dos pagamentos.
//
service Pagamento {
    // Ao receber notificacao de vencedor de um leilao
    rpc OnWinner (OnWinnerRequest) returns (OnWinnerResponse);
}

message OnWinnerRequest {
    string leilao_id = 1;
    string lance_vencedor = 2;
    string cliente_vencedor = 3;
}

message OnWinnerResponse {
    bool ok = 1;
    string message = 2;
}