edition = "2023";

service Gateway {
    rpc OnLanceValidado(OnLanceValidadoRequest) returns (OnLanceValidadoResponse) {}
    rpc OnLanceInvalidado(OnLanceInvalidadoRequest) returns (OnLanceInvalidadoResponse) {}
    rpc OnLeilaoVencedor(OnLeilaoVencedorRequest) returns (OnLeilaoVencedorResponse) {}
    rpc OnLinkPagamento(OnLinkPagamentoRequest) returns (OnLinkPagamentoResponse) {}
    rpc OnStatusPagamento(OnStatusPagamentoRequest) returns (OnStatusPagamentoResponse) {}
}

message OnLanceValidadoRequest {
    string leilao_id = 1;
    string client_id = 2;
    string value = 3;
}

message OnLanceValidadoResponse {
    bool ok = 1;
    string message = 2;
}

message OnLanceInvalidadoRequest {
    string leilao_id = 1;
    string client_id = 2;
    string value = 3;
}

message OnLanceInvalidadoResponse {
    bool ok = 1;
    string message = 2;
}

message OnLeilaoVencedorRequest {
    string leilao_id = 1;
    string lance_vencedor = 2;
    string cliente_vencedor = 3;
}

message OnLeilaoVencedorResponse {
    bool ok = 1;
    string message = 2;
}

message OnLinkPagamentoRequest {
    string leilao_id = 1;
    string lance_vencedor = 2;
    string cliente_vencedor = 3;
    string link = 4;
}

message OnLinkPagamentoResponse {
    bool ok = 1;
    string message = 2;
}

message OnStatusPagamentoRequest {
    string value = 1;
    string status = 2;
    string transaction_id = 3;
    string client_id = 4;
}

message OnStatusPagamentoResponse {
    bool ok = 1;
    string message = 2;

}
